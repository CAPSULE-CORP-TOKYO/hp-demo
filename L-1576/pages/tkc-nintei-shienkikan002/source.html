    <script type="text/javascript">
        $(function() {
            var objDspGuest = new dspGuest();
            $('#authDialog').css({
                'height': 'auto',
                'margin': 'auto',
                'top': ($(window).height() - $('#authDialog').height()) / 2,
            });
            
            // 認証ダイアログ閉じるボタンクリックハンドラ
            $('#btn_close').on('click', function() {
                $('#authDialog')[0].close();
                $('.ui-widget-overlay').remove();
            });

            // 認証ダイアログ視聴ボタンクリックハンドラ
            $('#btn_auth').on('click', function() {
                var strTicketId = pathUtils.getUrlParamValue('tid');
                var strUserName = $('input#input_name').val();
                var strPassword = $('input#input_pw').val();

                objDspGuest.authTicket(strTicketId, strUserName, strPassword);
            });

            // 説明文添付ファイル名クリックハンドラ
            $(document).on('click', 'a.dl_explan_file', function() {
                objDspGuest.downloadExplanAttachmentFile($(this).attr('id'), $('input#guest_name').val());
            });
        });
