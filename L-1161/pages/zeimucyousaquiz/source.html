<!DOCTYPE html><html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税務調査Q&amp;A クイズアプリ｜中小企業経営者のための実践ガイド</title>
<style>
  :root {
    --primary: #1a5276;
    --primary-light: #2980b9;
    --accent: #e67e22;
    --success: #27ae60;
    --danger: #c0392b;
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #2c3e50;
    --text-light: #7f8c8d;
    --border: #dce1e8;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: #fff;
    padding: 20px 24px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.05em; }
  .header .subtitle { font-size: 0.8rem; opacity: 0.85; margin-top: 4px; }
  .container { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

  /* スタート画面 */
  .start-screen { text-align: center; padding: 40px 20px; }
  .start-screen .logo {
    font-size: 3.5rem;
    margin-bottom: 16px;
  }
  .start-screen h2 { font-size: 1.4rem; margin-bottom: 12px; color: var(--primary); }
  .start-screen p { color: var(--text-light); margin-bottom: 24px; font-size: 0.95rem; }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .category-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .category-card:hover, .category-card.selected {
    border-color: var(--primary-light);
    background: #eaf2f8;
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .category-card .icon { font-size: 1.8rem; margin-bottom: 6px; }
  .category-card .label { font-size: 0.85rem; font-weight: 600; color: var(--primary); }
  .category-card .count { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }

  .btn {
    display: inline-block;
    padding: 14px 40px;
    border: none;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #d35400);
    color: #fff;
    box-shadow: 0 4px 12px rgba(230,126,34,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(230,126,34,0.45); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-outline {
    background: transparent;
    color: var(--primary);
    border: 2px solid var(--primary);
  }
  .btn-outline:hover { background: var(--primary); color: #fff; }
  .btn-sm { padding: 10px 24px; font-size: 0.9rem; }

  /* 進捗バー */
  .progress-section { margin-bottom: 20px; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.85rem;
  }
  .progress-info .category-tag {
    background: var(--primary);
    color: #fff;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-light), var(--accent));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* 問題カード */
  .question-card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .question-number {
    font-size: 0.8rem;
    color: var(--primary-light);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.8;
  }

  /* 選択肢 */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: #f8f9fb;
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-size: 0.95rem;
    line-height: 1.6;
    width: 100%;
    font-family: inherit;
    color: var(--text);
  }
  .option-btn:hover:not(.disabled) {
    border-color: var(--primary-light);
    background: #eaf2f8;
  }
  .option-label {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
  }
  .option-btn.correct {
    border-color: var(--success);
    background: #eafaf1;
  }
  .option-btn.correct .option-label { background: var(--success); }
  .option-btn.wrong {
    border-color: var(--danger);
    background: #fdedec;
  }
  .option-btn.wrong .option-label { background: var(--danger); }
  .option-btn.disabled { cursor: default; opacity: 0.7; }
  .option-btn.disabled.correct { opacity: 1; }

  /* 解説 */
  .explanation {
    background: #fef9e7;
    border-left: 4px solid var(--accent);
    border-radius: 0 12px 12px 0;
    padding: 20px;
    margin-top: 16px;
    animation: fadeIn 0.4s ease;
  }
  .explanation h4 {
    color: var(--accent);
    font-size: 0.9rem;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .explanation p { font-size: 0.9rem; line-height: 1.8; }
  .explanation .source {
    font-size: 0.78rem;
    color: var(--text-light);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #f0e6c8;
  }
  .next-btn-area { text-align: center; margin-top: 20px; }

  /* 結果画面 */
  .result-screen { text-align: center; padding: 30px 20px; }
  .result-card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
  }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    font-weight: 800;
    color: #fff;
    position: relative;
  }
  .score-circle .label { font-size: 0.75rem; font-weight: 500; }
  .score-high { background: linear-gradient(135deg, var(--success), #2ecc71); }
  .score-mid { background: linear-gradient(135deg, var(--accent), #f39c12); }
  .score-low { background: linear-gradient(135deg, var(--danger), #e74c3c); }

  .result-message { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
  .result-detail { font-size: 0.9rem; color: var(--text-light); margin-bottom: 24px; }

  .result-breakdown {
    text-align: left;
    margin-top: 20px;
  }
  .result-breakdown h4 {
    font-size: 0.9rem;
    color: var(--primary);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
  }
  .breakdown-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f2f5;
    font-size: 0.88rem;
  }
  .breakdown-item .cat-name { font-weight: 600; }
  .breakdown-item .cat-score { color: var(--primary-light); font-weight: 700; }

  .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* レビュー画面 */
  .review-item {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .review-item .q-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .review-item .badge {
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
  }
  .badge-correct { background: var(--success); }
  .badge-wrong { background: var(--danger); }
  .review-item .q-text { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
  .review-item .answer-info { font-size: 0.85rem; color: var(--text-light); }
  .review-item .answer-info strong { color: var(--success); }
  .review-item .exp-text { font-size: 0.85rem; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.7; }

  .back-top { text-align: center; margin: 24px 0; }

  /* フッター */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 0.75rem;
    color: var(--text-light);
  }
  .footer a { color: var(--primary-light); text-decoration: none; }

  /* レスポンシブ */
  @media (max-width: 480px) {
    .category-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.1rem; }
    .question-card { padding: 20px 16px; }
    .btn { padding: 12px 28px; font-size: 0.9rem; }
  }
</style>

    explanation: "インボイス制度の経過措置として、免税事業者からの仕入れについては段階的に控除割合が縮小されます。2023年10月〜2026年9月は80%控除、2026年10月〜2029年9月は50%控除、それ以降は控除不可となります。この経過措置は帳簿に一定の記載を行うことが要件です。税務調査でも経過措置の適用が正しいか確認されます。",
    source: "消費税法附則第52条、第53条（インボイス制度経過措置）"
  },

  // ── カテゴリ10: その他の重要事項 ──
  {
    id: 38,
    category: "その他",
    question: "税務調査の結果を従業員や取引先に知られることはありますか？",
    options: [
      "税務署が調査結果を公表することがあります",
      "調査官には守秘義務があり、調査で知り得た情報を第三者に漏らすことは法律で禁じられています",
      "取引先には反面調査の際に自社の申告内容が伝えられます",
      "税務署は調査結果を信用情報機関に報告します"
    ],
    correct: 1,
    explanation: "調査官には国家公務員法第100条に基づく守秘義務があり、職務上知り得た秘密を漏らすことは禁止されています。税務調査の結果が公表されたり、取引先に自社の申告内容が直接伝えられることはありません。反面調査はあくまで取引の事実確認が目的であり、調査対象企業の申告内容を開示するものではありません。",
    source: "国家公務員法第100条（秘密を守る義務）"
  },
  {
    id: 39,
    category: "その他",
    question: "税務調査が終了した後、同じ事項について再度調査されることはありますか？",
    options: [
      "一度調査が終わった事項は、二度と調査されません（一事不再理の原則）",
      "新たな情報があれば、同じ事項について再調査されることがあります",
      "3年経過すれば同じ事項でも再調査されます",
      "再調査は税務署長の許可が不要で、いつでも行われます"
    ],
    correct: 1,
    explanation: "国税通則法第74条の11第6項により、調査終了後に「新たに得られた情報」に照らして非違があると認められる場合は、再調査が行われることがあります。ただし、再調査を行うには税務署長の判断が必要であり、正当な理由なく繰り返し同じ事項を調査することは認められていません。",
    source: "国税通則法第74条の11第6項"
  },
  {
    id: 40,
    category: "その他",
    question: "税務調査に備えて、日頃から経営者が最も心がけるべきことはどれですか？",
    options: [
      "税務署との良好な人間関係を築いておくことです",
      "節税対策を最大限に活用して、納税額を極限まで減らすことです",
      "適正な記帳と証憑の整理保管を日常的に行い、顧問税理士と定期的にコミュニケーションをとることです",
      "税務調査が来ないよう、売上を調整して目立たないようにすることです"
    ],
    correct: 2,
    explanation: "税務調査への最善の備えは、日々の適正な記帳と証憑（領収書・請求書等）の整理保管を徹底し、顧問税理士との定期的なコミュニケーションによって正確な申告を行うことです。税務調査は正しい申告をしていれば恐れるものではありません。売上の調整は脱税行為にあたり、かえって重大なリスクを招きます。",
    source: "国税庁 税務調査手続FAQ（一般納税者向け）、法人税法第150条の2"
  }
];

const CATEGORIES = [
  { key: "基礎知識", icon: "📚", label: "基礎知識" },
  { key: "事前通知・日程", icon: "📞", label: "事前通知・日程" },
  { key: "当日の対応", icon: "🏢", label: "当日の対応" },
  { key: "帳簿・証憑", icon: "📋", label: "帳簿・証憑" },
  { key: "修正申告・更正", icon: "📝", label: "修正申告・更正" },
  { key: "加算税・延滞税", icon: "💰", label: "加算税・延滞税" },
  { key: "不服申立て", icon: "⚖️", label: "不服申立て" },
  { key: "実務の注意点", icon: "⚠️", label: "実務の注意点" },
  { key: "消費税の調査", icon: "🧾", label: "消費税の調査" },
  { key: "その他", icon: "📌", label: "その他" }
];

const OPTION_LABELS = ["A", "B", "C", "D"];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ================
// メインアプリ
// ================
function App() {
  const [screen, setScreen] = useState("start"); // start, quiz, result, review
  const [selectedCategory, setSelectedCategory] = useState("all");
  const [questions, setQuestions] = useState([]);
  const [currentIdx, setCurrentIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [results, setResults] = useState([]);

  const categoryCount = useMemo(() => {
    const counts = {};
    QUESTIONS.forEach(q => {
      counts[q.category] = (counts[q.category] || 0) + 1;
    });
    return counts;
  }, []);

  const startQuiz = useCallback(() => {
    let qs;
    if (selectedCategory === "all") {
      qs = shuffle(QUESTIONS);
    } else {
      qs = shuffle(QUESTIONS.filter(q => q.category === selectedCategory));
    }
    setQuestions(qs);
    setCurrentIdx(0);
    setSelected(null);
    setAnswered(false);
    setResults([]);
    setScreen("quiz");
  }, [selectedCategory]);

  const handleSelect = useCallback((idx) => {
    if (answered) return;
    setSelected(idx);
    setAnswered(true);
    setResults(prev => [...prev, {
      question: questions[currentIdx],
      selectedIdx: idx,
      isCorrect: idx === questions[currentIdx].correct
    }]);
  }, [answered, questions, currentIdx]);

  const nextQuestion = useCallback(() => {
    if (currentIdx + 1 >= questions.length) {
      setScreen("result");
    } else {
      setCurrentIdx(prev => prev + 1);
      setSelected(null);
      setAnswered(false);
    }
  }, [currentIdx, questions.length]);

  const correctCount = results.filter(r => r.isCorrect).length;
  const totalCount = results.length;
  const scorePercent = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;

  const categoryResults = useMemo(() => {
    const map = {};
    results.forEach(r => {
      const cat = r.question.category;
      if (!map[cat]) map[cat] = { correct: 0, total: 0 };
      map[cat].total++;
      if (r.isCorrect) map[cat].correct++;
    });
    return map;
  }, [results]);

  // スタート画面
  if (screen === "start") {
    return (
      <div>
        <div className="header">
          <h1>税務調査 Q&A クイズ</h1>
          <div className="subtitle">中小企業経営者のための実践ガイド</div>
        </div>
        <div className="container">
          <div className="start-screen">
            <div className="logo">🔍</div>
            <h2>税務調査の対応力をチェック！</h2>
            <p>国税庁の公式情報に基づいた全{QUESTIONS.length}問の実践的なクイズです。<br/>カテゴリを選んで、4択問題に挑戦してみましょう。</p>

            <div className="category-grid">
              <div
                className={`category-card ${selectedCategory === "all" ? "selected" : ""}`}
                onClick={() => setSelectedCategory("all")}
              >
                <div className="icon">🎯</div>
                <div className="label">全カテゴリ</div>
                <div className="count">全{QUESTIONS.length}問</div>
              </div>
              {CATEGORIES.map(cat => (
                <div
                  key={cat.key}
                  className={`category-card ${selectedCategory === cat.key ? "selected" : ""}`}
                  onClick={() => setSelectedCategory(cat.key)}
                >
                  <div className="icon">{cat.icon}</div>
                  <div className="label">{cat.label}</div>
                  <div className="count">{categoryCount[cat.key] || 0}問</div>
                </div>
              ))}
            </div>

            <button className="btn btn-primary" onClick={startQuiz}>
              クイズをスタート →
            </button>
          </div>

          <div className="footer">
            <p>本アプリは、国税庁公式情報に基づいて作成しています。<br/>
            参照：<a href="https://www.nta.go.jp/information/other/data/h24/nozeikankyo/ippan02.htm" target="_blank" rel="noopener">国税庁 税務調査手続FAQ</a></p>
            <p style={{marginTop: "8px"}}>© 2026 林税理士社労士事務所</p>
          </div>
        </div>
      </div>
    );
  }

  // クイズ画面
  if (screen === "quiz") {
    const q = questions[currentIdx];
    const progress = ((currentIdx + (answered ? 1 : 0)) / questions.length) * 100;
    const catInfo = CATEGORIES.find(c => c.key === q.category);

    return (
      <div>
        <div className="header">
          <h1>税務調査 Q&A クイズ</h1>
        </div>
        <div className="container">
          <div className="progress-section">
            <div className="progress-info">
              <span className="category-tag">{catInfo ? catInfo.icon : "📋"} {q.category}</span>
              <span>{currentIdx + 1} / {questions.length}</span>
            </div>
            <div className="progress-bar">
              <div className="progress-fill" style={{width: `${progress}%`}}></div>
            </div>
          </div>

          <div className="question-card" key={q.id}>
            <div className="question-number">第{currentIdx + 1}問</div>
            <div className="question-text">{q.question}</div>

            <div className="options">
              {q.options.map((opt, idx) => {
                let cls = "option-btn";
                if (answered) {
                  cls += " disabled";
                  if (idx === q.correct) cls += " correct";
                  else if (idx === selected && idx !== q.correct) cls += " wrong";
                }
                return (
                  <button key={idx} className={cls} onClick={() => handleSelect(idx)}>
                    <span className="option-label">{OPTION_LABELS[idx]}</span>
                    <span>{opt}</span>
                  </button>
                );
              })}
            </div>

            {answered && (
              <div className="explanation">
                <h4>{selected === q.correct ? "✅ 正解です！" : "❌ 不正解です"}</h4>
                <p>{q.explanation}</p>
                <div className="source">📖 根拠：{q.source}</div>
              </div>
            )}
          </div>

          {answered && (
            <div className="next-btn-area">
              <button className="btn btn-primary btn-sm" onClick={nextQuestion}>
                {currentIdx + 1 >= questions.length ? "結果を見る →" : "次の問題 →"}
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // 結果画面
  if (screen === "result") {
    const scoreClass = scorePercent >= 80 ? "score-high" : scorePercent >= 50 ? "score-mid" : "score-low";
    const getMessage = () => {
      if (scorePercent >= 90) return { title: "素晴らしい！", detail: "税務調査に対する深い理解をお持ちです。この知識を日常の経営にも活かしてください。" };
      if (scorePercent >= 70) return { title: "よくできました！", detail: "基本的な知識はしっかりと身についています。間違えた問題を復習して、さらに理解を深めましょう。" };
      if (scorePercent >= 50) return { title: "もう少しです！", detail: "いくつかの重要なポイントを見直す必要があります。解説をよく読んで、正しい知識を身につけましょう。" };
      return { title: "復習が必要です", detail: "税務調査の基本的な知識を体系的に学び直すことをお勧めします。顧問税理士にもご相談ください。" };
    };
    const msg = getMessage();

    return (
      <div>
        <div className="header">
          <h1>税務調査 Q&A クイズ</h1>
        </div>
        <div className="container">
          <div className="result-screen">
            <div className="result-card">
              <div className={`score-circle ${scoreClass}`}>
                {scorePercent}
                <span className="label">点</span>
              </div>
              <div className="result-message">{msg.title}</div>
              <div className="result-detail">
                {totalCount}問中 {correctCount}問正解　（正答率 {scorePercent}%）
              </div>
              <p style={{fontSize: "0.9rem", color: "#7f8c8d"}}>{msg.detail}</p>

              <div className="result-breakdown">
                <h4>カテゴリ別の成績</h4>
                {Object.entries(categoryResults).map(([cat, data]) => (
                  <div className="breakdown-item" key={cat}>
                    <span className="cat-name">{CATEGORIES.find(c => c.key === cat)?.icon} {cat}</span>
                    <span className="cat-score">{data.correct} / {data.total}（{Math.round((data.correct / data.total) * 100)}%）</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="btn-group">
              <button className="btn btn-primary btn-sm" onClick={() => setScreen("review")}>
                解答を振り返る
              </button>
              <button className="btn btn-outline btn-sm" onClick={() => { setScreen("start"); setSelectedCategory("all"); }}>
                トップに戻る
              </button>
            </div>
          </div>

          <div className="footer">
            <p>© 2026 林税理士社労士事務所</p>
          </div>
        </div>
      </div>
    );
  }

  // 振り返り画面
  if (screen === "review") {
    return (
      <div>
        <div className="header">
          <h1>解答の振り返り</h1>
        </div>
        <div className="container">
          {results.map((r, i) => (
            <div className="review-item" key={i}>
              <div className="q-header">
                <span className={`badge ${r.isCorrect ? "badge-correct" : "badge-wrong"}`}>
                  {r.isCorrect ? "正解" : "不正解"}
                </span>
                <span style={{fontSize: "0.8rem", color: "#7f8c8d"}}>第{i + 1}問｜{r.question.category}</span>
              </div>
              <div className="q-text">{r.question.question}</div>
              <div className="answer-info">
                あなたの回答：{OPTION_LABELS[r.selectedIdx]}. {r.question.options[r.selectedIdx]}<br/>
                <strong>正解：{OPTION_LABELS[r.question.correct]}. {r.question.options[r.question.correct]}</strong>
              </div>
              <div className="exp-text">{r.question.explanation}<br/><span style={{fontSize: "0.78rem", color: "#95a5a6"}}>📖 {r.question.source}</span></div>
            </div>
          ))}
          <div className="back-top">
            <button className="btn btn-outline btn-sm" onClick={() => setScreen("result")}>
              ← 結果に戻る
            </button>
            {" "}
            <button className="btn btn-primary btn-sm" onClick={() => { setScreen("start"); setSelectedCategory("all"); }}>
              トップに戻る
            </button>
          </div>
          <div className="footer">
            <p>© 2026 林税理士社労士事務所</p>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>


</body></html>
