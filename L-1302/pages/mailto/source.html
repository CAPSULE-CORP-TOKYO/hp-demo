<!DOCTYPE html><html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日立法人会 一般会員メールアドレス登録</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); }
        h2 { text-align: center; color: #004c99; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { display: block; width: 100%; padding: 12px; background-color: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; transition: background-color 0.3s ease; }
        button:hover { background-color: #0056b3; }
        .note { margin-top: 15px; padding: 10px; background-color: #f9f9c5; border-left: 5px solid #ffcc00; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h2>日立法人会 一般会員メールアドレス登録フォーム</h2>
        
        <form action="sendto.php" method="POST">
            
            <div class="form-group">
                <label for="company">法人名/会社名 <span style="color: red;">*</span></label>
                <input type="text" id="company" name="company" required="" placeholder="例：株式会社日立商事" autocomplete="organization" style="">
            </div>

            <div class="form-group">
                <label for="name">ご担当者氏名 <span style="color: red;">*</span></label>
                <input type="text" id="name" name="name" required="" placeholder="例：日立 太郎" autocomplete="name" style="">
            </div>
            
            <div class="form-group">
                <label for="email">メールアドレス <span style="color: red;">*</span></label>
                <input type="email" id="email" name="email" required="" placeholder="連絡がつきやすいアドレスをご入力ください" autocomplete="email" style="">
            </div>

            <button type="submit">登録内容を送信する</button>

            <div class="note">
                <p>※ご登録いただいたメールアドレスは、法人会からの大切なお知らせやセミナーのご案内などに利用させていただきます。</p>
            </div>
        </form>
    </div>

</body></html>
